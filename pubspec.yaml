name: flutter_scroll_kit
description: >-
  Composable Flutter scroll primitives: line-snap scroll physics, VS
  Code-style sticky hierarchical headers, virtualized fixed-height line
  views, and REPL-style scrollback.
version: 0.1.1
homepage: https://github.com/repentsinner/flutter_scroll_kit
repository: https://github.com/repentsinner/flutter_scroll_kit
issue_tracker: https://github.com/repentsinner/flutter_scroll_kit/issues
topics:
  - scroll
  - sticky-header
  - virtualization
  - list
  - repl

environment:
  # The Flutter floor follows from the Dart floor: a Flutter release bundles
  # exactly one Dart SDK, and 3.38.1 is the first stable whose Dart satisfies
  # ^3.10.0 (3.38.0 ships a 3.10.0 beta build, which sorts below it). `quality.yml`
  # builds this floor on every PR, so it stays a tested property, not a claim.
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

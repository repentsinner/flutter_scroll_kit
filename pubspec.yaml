name: flutter_scroll_kit_workspace
publish_to: none

environment:
  # The Flutter floor follows from the Dart floor: a Flutter release bundles
  # exactly one Dart SDK, and 3.38.1 is the first stable whose Dart satisfies
  # ^3.10.0 (3.38.0 ships a 3.10.0 beta build, which sorts below it). `ci.yml`
  # builds this floor on every PR, so it stays a tested property, not a claim.
  sdk: ^3.10.0
  flutter: ">=3.38.1"

workspace:
  - packages/line_snap_scroll_physics
  - packages/sticky_hierarchical_scroll
  - packages/fixed_line_view
  - packages/repl_view
  - packages/line_snap_scroll_physics/example
  - packages/sticky_hierarchical_scroll/example
  - packages/fixed_line_view/example
  - packages/repl_view/example

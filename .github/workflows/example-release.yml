# Attaches release builds of the example app to each GitHub release, then
# publishes the release.
#
# The repository uses immutable releases, which freeze a release's assets
# once it publishes. Flywheel therefore leaves each release as a draft
# (`release_as_draft` in .flywheel.yml). GitHub fires no release events for
# a draft, so this workflow runs on the tag push, attaches the builds to
# the draft, and publishes it as its last step. If a build fails, the
# release stays a draft; re-running the failed job completes it.
#
# Each platform builds on its own runner, because Flutter desktop builds
# only for the host OS. The example carries no platform folders, so
# `flutter create` generates them for the one platform each leg builds.
# The builds are unsigned: macOS Gatekeeper and Windows SmartScreen warn on
# first launch.
name: Example release builds

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write # gh release upload
    strategy:
      # One platform failing still leaves the other two worth building, and
      # the release stays a draft until every platform attaches.
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: macos
            runner: macos-latest
          - platform: windows
            runner: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
      ASSET_BASE: flutter_scroll_kit_example-${{ github.ref_name }}-${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Builds with the toolchain the repo develops on.
      - id: sdk
        name: Resolve SDK version
        env:
          MATRIX_SDK: pinned
        run: .github/scripts/resolve-sdk.sh

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.sdk.outputs.version }}
          cache: true

      # Linux desktop toolchain: https://docs.flutter.dev/platform-integration/linux/setup
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Build
        working-directory: example
        run: |
          flutter create --platforms=${{ matrix.platform }} .
          flutter build ${{ matrix.platform }} --release

      - name: Archive (linux)
        if: matrix.platform == 'linux'
        run: tar -czf "$ASSET_BASE-x64.tar.gz" -C example/build/linux/x64/release bundle
      - name: Archive (macos)
        if: matrix.platform == 'macos'
        run: |
          ditto -c -k --keepParent \
            example/build/macos/Build/Products/Release/flutter_scroll_kit_example.app \
            "$ASSET_BASE.zip"
      - name: Archive (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path example/build/windows/x64/runner/Release/* `
            -DestinationPath "$env:ASSET_BASE-x64.zip"

      # Flywheel pushes the tag a moment before it creates the draft, so the
      # upload waits for the draft to exist.
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 24); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 5
          done
          gh release upload "$TAG" "$ASSET_BASE"* --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release edit
    steps:
      # Publishing freezes the release and its assets.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

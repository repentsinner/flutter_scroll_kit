version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns: ["*"]

  # The example depends on the package by path and keeps its own
  # pubspec, so it needs an entry of its own.
  - package-ecosystem: pub
    directories:
      - /
      - /example
    schedule:
      interval: weekly
    labels:
      - dependencies
      - dart
    groups:
      dart-deps:
        patterns: ["*"]
